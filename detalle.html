<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarket - Detalle del Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-metal { background: linear-gradient(145deg, #2a2d34, #1a1c23); box-shadow: 5px 5px 10px #15171c, -5px -5px 10px #2f333c; }
        .text-neon { color: #00d2ff; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans min-h-screen">
    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="font-bold text-2xl text-neon cursor-pointer" onclick="window.location.href='index.html'">TECHMARKET</span>
            <a href="index.html" class="text-gray-300 hover:text-white">Volver al Catálogo</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-8 mt-10">
        <div class="bg-metal rounded-2xl p-8 md:p-12 border border-gray-700 flex flex-col md:flex-row gap-12">
            <!-- Imagen (Placeholder) -->
            <div class="w-full md:w-1/2 bg-gray-800 rounded-xl flex items-center justify-center min-h-[300px] border border-gray-600">
                <span class="text-gray-500 text-lg">Imagen del Producto</span>
            </div>
            
            <!-- Detalles -->
            <div class="w-full md:w-1/2 flex flex-col justify-center">
                <span class="text-sm text-blue-400 font-bold tracking-widest uppercase mb-2">Categoría: Laptops</span>
                <h1 class="text-4xl font-extrabold text-white mb-4">Laptop Asus ROG Strix</h1>
                <p class="text-gray-400 mb-6 leading-relaxed">
                    Potente laptop gamer equipada con procesador de última generación, ideal para alto rendimiento en juegos y tareas de diseño gráfico.
                </p>
                <div class="text-4xl font-black text-neon mb-4">$ 4.500.000 COP</div>
                <div class="flex items-center space-x-4 mb-8">
                    <span class="bg-green-900/50 text-green-400 border border-green-700 px-3 py-1 rounded-full text-sm font-semibold">
                        En Stock: 15 unidades
                    </span>
                </div>
                
                <div class="flex space-x-4">
                    <input type="number" value="1" min="1" class="w-20 bg-gray-800 border border-gray-600 rounded-lg px-4 text-center text-white text-lg">
                    <button class="flex-grow bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-lg shadow-blue-600/30">
                        Añadir al Carrito
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
