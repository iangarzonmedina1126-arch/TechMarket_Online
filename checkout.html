<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarket - Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-metal { background: linear-gradient(145deg, #2a2d34, #1a1c23); }
        .text-neon { color: #00d2ff; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="max-w-7xl mx-auto text-center">
            <span class="font-bold text-2xl text-neon">TECHMARKET - PAGO SEGURO</span>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-8 mt-6">
        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- Formulario de Envío y Pago -->
            <div class="flex-grow space-y-8">
                <!-- Datos de Envío -->
                <div class="bg-metal rounded-xl p-6 border border-gray-700">
                    <h3 class="text-xl font-bold text-white mb-4 border-b border-gray-600 pb-2">Datos de Envío (Ubicación)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" placeholder="Ciudad" class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <input type="text" placeholder="Departamento" class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <input type="text" placeholder="Dirección (Ej. Calle 10 # 20-30)" class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white col-span-full">
                    </div>
                </div>

                <!-- Método de Pago -->
                <div class="bg-metal rounded-xl p-6 border border-gray-700">
                    <h3 class="text-xl font-bold text-white mb-4 border-b border-gray-600 pb-2">Método de Pago</h3>
                    <div class="space-y-3">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="pago" class="form-radio text-blue-500 bg-gray-800 border-gray-600">
                            <span class="text-gray-300">Tarjeta de Crédito / Débito</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="pago" class="form-radio text-blue-500 bg-gray-800 border-gray-600">
                            <span class="text-gray-300">PSE / Transferencia</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="pago" class="form-radio text-blue-500 bg-gray-800 border-gray-600">
                            <span class="text-gray-300">Efectivo contra entrega</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Resumen y Botón Final -->
            <div class="w-full md:w-1/3 bg-gray-800 rounded-xl p-6 border border-gray-700 h-fit">
                <h3 class="text-xl font-bold mb-4">Total a Pagar</h3>
                <div class="text-3xl font-black text-neon mb-6">$ 4.520.000</div>
                <button onclick="alert('¡Pedido Registrado en SQL Server!')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    Confirmar Pedido
                </button>
            </div>
        </div>
    </main>
</body>
</html>
