<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarket - Carrito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-metal { background: linear-gradient(145deg, #2a2d34, #1a1c23); box-shadow: 5px 5px 10px #15171c, -5px -5px 10px #2f333c; }
        .text-neon { color: #00d2ff; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="font-bold text-2xl tracking-wider text-neon cursor-pointer" onclick="window.location.href='index.html'">TECHMARKET</span>
            <a href="index.html" class="text-gray-300 hover:text-white">Volver al Catálogo</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-8">
        <h2 class="text-3xl font-bold mb-8 border-l-4 border-blue-500 pl-4">Tu Carrito de Compras</h2>
        
        <div class="flex flex-col md:flex-row gap-8">
            <div class="flex-grow space-y-4">
                <!-- Ítem del carrito -->
                <div class="bg-metal rounded-xl p-6 border border-gray-700 flex justify-between items-center">
                    <div>
                        <h3 class="text-xl font-bold text-white">Laptop Asus ROG</h3>
                        <p class="text-neon font-bold mt-1">$ 4.500.000</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <input type="number" value="1" min="1" class="w-16 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-center text-white">
                        <button class="text-red-500 hover:text-red-400 font-bold">X</button>
                    </div>
                </div>
            </div>

            <!-- Resumen de compra -->
            <div class="w-full md:w-1/3 bg-gray-800 rounded-xl p-6 border border-gray-700 h-fit sticky top-24">
                <h3 class="text-xl font-bold mb-4">Resumen</h3>
                <div class="flex justify-between text-gray-400 mb-2"><span>Subtotal</span><span>$ 4.500.000</span></div>
                <div class="flex justify-between text-gray-400 mb-4"><span>Envío</span><span>$ 20.000</span></div>
                <hr class="border-gray-600 mb-4">
                <div class="flex justify-between text-xl font-bold text-white mb-6"><span>Total</span><span class="text-neon">$ 4.520.000</span></div>
                <button class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    Ir al Checkout
                </button>
            </div>
        </div>
    </main>
</body>
</html>
